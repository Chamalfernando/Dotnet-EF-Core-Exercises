services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: efcoreexcercises
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d efcoreexcercises"]
      interval: 5s
      timeout: 5s
      retries: 10

  efcoreexcercises:
    image: ${DOCKER_REGISTRY-}efcoreexcercises
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
